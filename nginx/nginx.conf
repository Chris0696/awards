user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # -------- HTTP -> HTTPS Redirect --------
    server {
        listen 80;
        server_name awardprojectvoting.scarsoft.net;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------- HTTPS --------
    server {
        listen 443 ssl;
        server_name awardprojectvoting.scarsoft.net;

        ssl_certificate /etc/letsencrypt/live/awardprojectvoting.scarsoft.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/awardprojectvoting.scarsoft.net/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location ^~ /api/v1/auth/refresh {
    proxy_pass http://web:3000/api/v1/auth/refresh;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

        # -------- Django Backend --------
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------- Static & Media (Django collectstatic & uploads) --------
        location /static/ {
            alias /var/www/static/;
        }

        location /media/ {
            alias /var/www/media/;
        }

        # -------- Next.js Frontend --------
        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
