<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Joyeux anniversaire" %}</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            margin: 0; 
            padding: 0; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container { 
            max-width: 600px;
            margin: 0 auto; 
            background: white; 
            border-radius: 10px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header { 
            background: linear-gradient(135deg, #ff6b6b, #ffa726); 
            color: white; 
            padding: 30px; 
            text-align: center; 
        }
        .header h1 { 
            margin: 0; 
            font-size: 2.5em; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3); 
        }
        .content { 
            padding: 40px 30px; 
            text-align: center; 
        }
        .message { 
            font-size: 1.2em; 
            line-height: 1.6; 
            margin-bottom: 20px; 
            color: #333; 
        }
        .message.main { 
            font-size: 2em; 
            font-weight: bold; 
            color: #667eea; 
            margin-bottom: 30px; 
        }
        .footer { 
            background: #f8f9fa; 
            padding: 20px; 
            text-align: center; 
            border-top: 1px solid #dee2e6; 
        }
        .logo-container img { 
            max-height: 50px; 
            max-width: 200px; 
        }
        .fallback { 
            font-weight: bold; 
            color: #667eea; 
            font-size: 1.5em; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Mot de passe oublié !</h1>
        </div>
        <div class="content">
            <h1 class="message main">
                Bonjour <b>{{full_name|title}}</b>
            </h1>
            
            <p class="message">Vous avez demandé à réinitialiser votre mot de passe. Utilisez le lien : <a href="{{link}}">Changer mon mot de passe</a>.</p>
            
            <p class="message">
                Si vous n'avez pas demandé à réinitialiser votre mot de passe, alors <a href="">contactez-nous maintenant.</a>
            </p>
        </div>
        <div class="footer">
            <div class="logo-container">
                    <div class="fallback">Project Awards</div>
            </div>
        </div>
    </div>
</body>
</html>
