services:
  postgres_db:
    image: postgres:16.1-bookworm
    ports:
      - "5434:5432"
    volumes:
      - awards_local_pgdata:/var/lib/postgresql/data
    env_file: .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 15m
    networks:
      - awards-bridge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    depends_on:
      postgres_db:
        condition: service_healthy
    volumes:
      - awards_collectstatic:/usr/src/app/collectstatic
      - awards_media:/usr/src/app/media
      - ./backend/log:/usr/src/app/log
      - ./.env:/usr/src/app/.env:ro
    env_file: .env
    environment:
      - ALLOWED_HOSTS=projectawards.scarsoft.net,localhost,127.0.0.1,backend
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn awards.wsgi:application --name awards --workers 3 -b 0.0.0.0:8000
      "
    networks:
      - awards-bridge

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000/api/v1/
      - PROD_API_URL=https://projectawards.scarsoft.net/api/v1/
    networks:
      - awards-bridge

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
      - ./nginx/www:/var/www/certbot
      - awards_collectstatic:/var/www/static:ro
      - awards_media:/var/www/media:ro
    depends_on:
      - backend
      - web
    networks:
      - awards-bridge
    restart: unless-stopped

networks:
  awards-bridge:
    driver: bridge

volumes:
  awards_local_pgdata: {}
  awards_collectstatic: {}
  awards_media: {}
