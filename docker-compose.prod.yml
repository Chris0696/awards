services:
  postgres_db:
    image: postgres:16.1-bookworm
    ports:
      - "5434:5432"
    volumes:
      - awards_local_pgdata:/var/lib/postgresql/data
    env_file: .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 15m
    networks:
      - awards-bridge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres_db:
        condition: service_healthy
    volumes:
      - ./backend:/usr/src/app
      - awards_collectstatic:/usr/src/app/collectstatic
      - ./backend/log:/usr/src/app/log
      - ./backend/media:/usr/src/app/media
      - ./.env:/usr/src/app/.env:ro
    env_file: .env
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn awards.wsgi:application --name awards --workers 3 -b :8000
      "
    networks:
      - awards-bridge

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app:ro  # Read-only to prevent host permission issues
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    networks:
      - awards-bridge

networks:
  awards-bridge:
    driver: bridge

volumes:
  awards_local_pgdata: {}
  awards_collectstatic: {}